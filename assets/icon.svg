<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Party Challenges</title>
  <!-- Party Challenges: three level cards (Easy, Medium, Hard) and a dart in the bullseye.
       96px of artwork inside 16px transparent padding, as the Chrome Web Store asks. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g transform="translate(64 64) scale(0.94) translate(-64 -64)">
  <g transform="translate(0 -3)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">
    <rect x="35" y="22" width="58" height="84" rx="8" fill="#12cf81" transform="rotate(-14 64 112)" filter="url(#shadow)"/>
    <rect x="35" y="22" width="58" height="84" rx="8" fill="#e24e67" transform="rotate(14 64 112)" filter="url(#shadow)"/>
    <rect x="35" y="22" width="58" height="84" rx="8" fill="#fc712b" filter="url(#shadow)"/>
  </g>
  <g transform="translate(64 61)">
    <circle r="21" fill="#fff"/>
    <circle r="15.5" fill="#1b1f29"/>
    <circle r="10" fill="#fff"/>
    <circle r="4.5" fill="#e24e67"/>
    <g transform="rotate(-45)" stroke-linejoin="round">
      <polygon points="0,0 8,-1.3 8,1.3" fill="#1b1f29"/>
      <rect x="8" y="-3" width="13" height="6" rx="2" fill="#1b1f29"/>
      <rect x="20" y="-1.3" width="10" height="2.6" fill="#1b1f29"/>
      <polygon points="27,0 38,-9 43,-9 37,0 43,9 38,9" fill="#fff" stroke="#1b1f29" stroke-width="1.6"/>
    </g>
  </g>
  </g>
</svg>
