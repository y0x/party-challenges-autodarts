version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      # v10 needs conventional-changelog-writer 9, @semantic-release/release-notes-generator still uses 8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
    commit-message:
      # Runtime dependencies end up in the extension, so their updates are released.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
