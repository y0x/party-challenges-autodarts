name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Turn on "Log Autodarts match messages" in the extension settings and paste the console output from the match page. Remove anything you don't want to share.
      render: text
