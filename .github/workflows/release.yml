name: Release

# Every push to main: semantic-release picks the version from the conventional commits and creates
# the tag and the GitHub release, then the package is built and attached. Publishing to the stores
# is a separate, manual workflow (publish.yml).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on pull requests included in the release
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only semantic-release runs in this job, so install without lifecycle scripts or cache.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
          cache: ""

      - name: Semantic release
        id: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the released version without write access to the repository.
  build:
    name: Build
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build and zip
        run: |
          pnpm pkg set version="$VERSION"
          pnpm zip
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: .output/*-chrome.zip
          include-hidden-files: true # .output is a hidden folder
          retention-days: 7
          if-no-files-found: error

  # Attaches the package to the release. Runs no project code.
  upload:
    name: Upload
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload the release asset
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist

      # Artifact attestations are free for public repositories only.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Attach to release
        run: gh release upload "v$VERSION" dist/*-chrome.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
